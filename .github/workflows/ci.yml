name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A cold build regenerates ~166 AVIF and WebP variants, which takes
      # minutes. Keyed on the source images so it invalidates when they change.
      - name: Restore image transform cache
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-cache-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the full gate
        run: npm run verify

      # Runs against the built output, so it checks the links a visitor would
      # actually follow rather than the ones written in source.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            --include-mail=false
            --exclude-path dist/og
            'dist/**/*.html'
          fail: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
